# Presence — production stack.
#
# Two application containers on purpose:
#   web       serves the API and dashboards, and can be scaled out
#   scheduler runs the monitoring loop, and must stay a single instance
#
# Running the monitor in every web replica would mean every replica raising the
# same alert, so the web containers set PRESENCE_DISABLE_SCHEDULER.

name: presence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presence}
      POSTGRES_USER: ${POSTGRES_USER:-presence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-backup.sh:/usr/local/bin/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presence} -d ${POSTGRES_DB:-presence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    networks: [internal]

  web:
    build: ./backend
    restart: unless-stopped
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 4 --proxy-headers --forwarded-allow-ips '*'
    env_file: [.env]
    environment:
      PRESENCE_DISABLE_SCHEDULER: "1"
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]

  scheduler:
    build: ./backend
    restart: unless-stopped
    # Serves nothing; it exists to run the monitor and notification jobs.
    command: python -m app.worker
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [web]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
