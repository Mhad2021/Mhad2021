# Presence reverse proxy.
#
# Replace the certificate paths with your own before going live. An internal
# CA certificate is fine — the agent trusts the system store, and the installer
# can push your CA to every laptop.

upstream presence_app {
    server web:8000;
    keepalive 32;
}

# Rate limits sized for the agent's traffic: one heartbeat per laptop every
# 30-60s, so 10r/s with a burst is generous even at 200 employees.
limit_req_zone $binary_remote_addr zone=presence_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=presence_login:10m rate=1r/s;

server {
    listen 80;
    server_name _;
    # Leave this path open if you use HTTP-01 certificate renewal.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/presence.crt;
    ssl_certificate_key /etc/nginx/certs/presence.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    location / {
        limit_req zone=presence_api burst=40 nodelay;
        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Brute-force protection on the two endpoints that take a password.
    location = /api/v1/auth/login {
        limit_req zone=presence_login burst=5 nodelay;
        proxy_pass http://presence_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/agent/login {
        limit_req zone=presence_login burst=5 nodelay;
        proxy_pass http://presence_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live board's event stream must not be buffered or it arrives in bursts.
    location /api/v1/live/stream {
        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /static/ {
        proxy_pass http://presence_app;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }
}
