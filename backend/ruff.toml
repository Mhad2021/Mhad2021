line-length = 96
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependencies are function calls in defaults by design
    "N818",   # exception names follow the domain, not the Error suffix rule
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"app/models/*" = ["F401"]
